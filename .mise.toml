# プロジェクト固有のツールだけを置く。AI CLI・uv・playwright・mise の settings など
# プロジェクト共通の設定は .config/mise/conf.d/shared.toml（テンプレート同期対象）が持つ。
[tools]
node = ["22", "24"]
python = "3.14"
pnpm = "10"
jj = "latest"

[tasks.chromium-path]
run = "ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1"
description = "Get Playwright Chromium executable path"
